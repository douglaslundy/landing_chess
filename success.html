<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Compra confirmada | Xadrez Essencial</title>
  <style>
    :root { color-scheme: dark; --red:#d10e17; --text:#f7f2ea; --muted:#aaa39b; --line:rgba(255,255,255,.14); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#0b0b0e; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(620px,100%); text-align:center; padding:46px 30px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.035); box-shadow:0 24px 70px rgba(0,0,0,.38); }
    .mark { width:64px; height:64px; margin:0 auto 22px; display:grid; place-items:center; border-radius:50%; background:rgba(209,14,23,.16); border:1px solid rgba(255,42,47,.55); color:#ff686d; font-size:2rem; font-weight:900; }
    h1 { margin:0 0 14px; font:900 clamp(2rem,6vw,3.3rem)/1.02 Georgia,serif; }
    p { color:var(--muted); line-height:1.65; margin:0 auto 12px; max-width:500px; }
    .buyer { color:var(--text); font-weight:800; }
    .status { min-height:26px; margin:22px auto; color:#f0d3a2; font-size:.92rem; }
    .actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:24px; }
    .btn { min-height:48px; padding:0 20px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; border:1px solid var(--line); color:var(--text); text-decoration:none; font-weight:850; cursor:pointer; }
    .btn-primary { background:var(--red); border-color:var(--red); }
    .btn-primary[aria-disabled="true"] { opacity:.5; pointer-events:none; }
    .btn-ghost { background:rgba(255,255,255,.04); }
    .error { color:#ffb7b7; }
    .back { display:inline-block; margin-top:28px; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1 id="title">Confirmando sua compra</h1>
    <p id="message">Estamos consultando a confirmação oficial do pagamento.</p>
    <p id="buyer" class="buyer" hidden></p>
    <p id="email-status" class="status" role="status" aria-live="polite">Aguarde um instante.</p>
    <div class="actions">
      <a id="access-button" class="btn btn-primary" href="#" aria-disabled="true">Acessar meu produto</a>
      <a class="btn btn-ghost" href="index.html">Voltar para a página inicial</a>
    </div>
    <a class="back" href="index.html#faq">Precisa de ajuda?</a>
  </main>
  <script src="assets/success.js"></script>
</body>
</html>
